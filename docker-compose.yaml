# ── Usage examples ─────────────────────────────────────────────────────
# Start everything:    docker compose up -d
# Infra only:          docker compose up -d redis postgres pgbouncer
# Single service:      docker compose up -d analytics-service
# With backups:        docker compose --profile backup up -d
# ──────────────────────────────────────────────────────────────────────
#
# 50K-Scale Connection Pool Model (Step 6):
#   Postgres max_connections: 200 (configured via command flags below)
#   PgBouncer pool_size: 25 per service, transaction mode
#   4 services × 25 = 100 DB connections max (within the 200 limit)
#   With BullMQ workers + admin headroom → ~200 total peak connections
#
# Redis Memory Model (Step 7):
#   Session cache: ~20K active users × 1KB = ~20MB
#   Analytics cache: ~50K users × 5KB = 250MB theoretical max
#   With LRU eviction at 256MB limit: only hot users stay in cache
#   TTLs prevent unbounded growth:
#     - Focus score: 60s
#     - Dashboard BFF: 120s
#     - Overview: 120s
#     - Strategic: 5min
#     - SRL weekly: 5min
#     - Notification intel: 1h
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    # 50K-Scale Redis config (Step 7):
    #   - allkeys-lru: ALL keys eligible for eviction when memory limit hit.
    #     This is critical — without this, analytics cache keys fill memory
    #     until Redis returns OOM errors on write.
    #   - maxmemory 256mb: Covers ~50K active analytical sessions (5KB each)
    #     with LRU eviction trimming the least-recently-used users.
    #   - lazyfree-lazy-eviction: Evictions happen in background thread,
    #     preventing latency spikes on the main Redis thread.
    #   - save "": Disable RDB snapshots (pure cache, no durability needed)
    #   - appendonly no: No AOF either — cache is reconstructable from DB.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --save ""
      --appendonly no
      --tcp-keepalive 60
      --timeout 300
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 280m   # 256MB Redis + 24MB overhead
          cpus: '0.50'

