# ── Usage examples ─────────────────────────────────────────────────────
# Start everything:    docker compose up -d
# Infra only:          docker compose up -d redis postgres
# Single service:      docker compose up -d analytics-service
# With backups:         docker compose --profile backup up -d
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

