  # ── PgBouncer — Connection Pooler (Step 6) ────────────────────────────
  #
  # Why PgBouncer:
  #   Without pooling: 4 services × N threads → N connections at once.
  #   At 50K users with peak analytics load, connections can spike to 500+.
  #   Postgres crashes beyond max_connections (200).
  #
  #   PgBouncer pools connections in TRANSACTION mode:
  #   Each service gets a pool of 25 server-side connections.
  #   Clients (app servers) can have thousands of "connections" to PgBouncer
  #   which PgBouncer multiplexes down to 25 real Postgres connections per service.
  #
  # Pool math:
  #   4 services × pool_size=25 = 100 DB connections max
  #   + 20 reserve for admin/migrations = 120 total
  #   Postgres max_connections=200 → safe headroom
  # pgbouncer:
  #   image: bitnami/pgbouncer:latest
  #   ports:
  #     - "127.0.0.1:5433:5432"  # App services connect to port 5433
  #   environment:
  #     POSTGRESQL_HOST: postgres
  #     POSTGRESQL_PORT: 5432
  #     POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
  #     POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-password}
  #     POSTGRESQL_DATABASE: ${POSTGRES_DB:-transition}
  #     PGBOUNCER_POOL_MODE: transaction       # Best for analytics workloads
  #     PGBOUNCER_MAX_CLIENT_CONN: 1000        # Max simultaneous app connections
  #     PGBOUNCER_DEFAULT_POOL_SIZE: 25        # Server-side connections per database
  #     PGBOUNCER_RESERVE_POOL_SIZE: 5         # Extra connections for burst
  #     PGBOUNCER_RESERVE_POOL_TIMEOUT: 3      # Wait 3s before using reserve pool
  #     PGBOUNCER_SERVER_IDLE_TIMEOUT: 600     # Release idle connections after 10min
  #     PGBOUNCER_CLIENT_IDLE_TIMEOUT: 300     # Disconnect idle clients after 5min
  #     PGBOUNCER_LOG_CONNECTIONS: 0
  #     PGBOUNCER_LOG_DISCONNECTIONS: 0
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 64m
